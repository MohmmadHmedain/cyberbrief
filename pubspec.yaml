name: cyberguard
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Localization (RTL + locale support)
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Authentication
  local_auth: ^2.1.6
  google_sign_in: ^6.2.1

  # Networking, storage, and state management
  http: ^1.2.0
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5

  # AI, voice, image, and permissions
  image_picker: ^1.1.1
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.2
  permission_handler: ^12.0.1
  file_picker: ^8.0.0
  archive: ^3.3.4
  xml: ^6.1.0

  # UI & animations
  flutter_spinkit: ^5.2.1
  animations: ^2.0.11

  # File scanning
  saf: ^1.0.4
  crypto: ^3.0.3

  # Local database and encryption
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cryptography: ^2.5.0
  flutter_secure_storage: ^9.0.0

  # Backend (Supabase)
  supabase_flutter: ^2.10.3

  # Sharing scan history / data export
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
    - assets/icon/photo_2025-10-28_21-51-51.jpg
    - assets/icon/photo_2025-10-29_00-20-45.jpg
    - assets/icon/google_logo.png
